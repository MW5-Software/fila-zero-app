# Extração das frases traduzíveis (Babel, e não `makemessages`).
#
# O `makemessages` do Django precisa do `xgettext` do sistema instalado, e os
# templates desta casa são JINJA2 (`nucleo/rendering.py`), que o extrator do
# Django não lê — ele procuraria `{% trans %}` do Django e não acharia nada.
# O Babel é Python puro, entra no `uv sync` como qualquer dependência e sabe
# ler os dois.
[python: **.py]
# Os templates DESTA CASA (`plataforma/templates/`) chamam `traduzir(...)`.
# O `-k traduzir` na linha de comando é o que faz o extrator enxergá-la;
# sem ele, as frases do cabeçalho e da paginação ficariam de fora do `.po`
# sem erro nenhum — o pior tipo de esquecimento, o silencioso.
[jinja2: **/templates/**.html]
extensions=jinja2.ext.i18n
