name: publicar-imagem

on:
  workflow_run:
    workflows:
      - testes
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    # Só publica se a suíte de testes tiver terminado com sucesso.
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Baixar código testado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: | 
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/mw5-software/kronos-base:latest
            ghcr.io/mw5-software/kronos-base:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
